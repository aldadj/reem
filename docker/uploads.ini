; ---------------------------------------------------------------------------
; Limites de televersement REEM
; ---------------------------------------------------------------------------
; L'image officielle php:8.3-apache utilise par defaut :
;     upload_max_filesize = 2M
;     post_max_size       = 8M
; Toute video reelle depassant 2 Mo etait donc rejetee par PHP avant meme
; d'atteindre Laravel, ce qui produisait :
;     "Echec de la publication : The video failed to upload."
;
; La validation Laravel autorise jusqu'a 100 Mo (regle « max:102400 »),
; on laisse donc une marge confortable au-dessus.

upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_file_uploads = 20
